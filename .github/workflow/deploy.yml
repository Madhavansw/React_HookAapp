name: Build and Deploy

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
  workflow_dispatch:

permissions:
  contents: write

# Only one deploy at a time, so branches don't overwrite each other
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Work out base path and target folder
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "BASE=/$REPO/" >> $GITHUB_ENV
            echo "TARGET=." >> $GITHUB_ENV
          else
            SLUG="${GITHUB_REF_NAME//\//-}"
            echo "BASE=/$REPO/previews/$SLUG/" >> $GITHUB_ENV
            echo "TARGET=previews/$SLUG" >> $GITHUB_ENV
          fi

      - name: Build
        run: npm run build -- --base=$BASE

      - name: Deploy production (main)
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: previews

      - name: Deploy preview (feature branch)
        if: github.ref != 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: ${{ env.TARGET }}